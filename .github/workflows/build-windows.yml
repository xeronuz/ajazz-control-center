name: Build Windows (AKP032)

on:
  push:
    branches: [ feat/akp032-support, main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows x64 (MSI + Portable ZIP)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          submodules: recursive

      - name: Install MSVC toolchain
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730  # v4.3.1
        with:
          version: 6.8.3
          cache: true
          modules: qtshadertools qtwebsockets qtwebengine qtwebchannel qtpositioning

      - name: Set up Rust (mirajazz sidecar)
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - name: Configure CMake
        run: cmake --preset windows-release -DAJAZZ_ENABLE_WERROR=OFF

      - name: Build
        run: cmake --build --preset windows-release

      - name: Package (CPack)
        run: cpack --config CPackConfig.cmake
        working-directory: build/windows-release

      - name: Upload Windows Packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ajazz-control-center-akp032-win64
          path: |
            build/windows-release/*.zip
            build/windows-release/*.msi
